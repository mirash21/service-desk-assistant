# Nginx configuration for Admin Panel
# Place this file in: /etc/nginx/sites-available/admin-panel.conf
# Then: sudo ln -s /etc/nginx/sites-available/admin-panel.conf /etc/nginx/sites-enabled/
# And: sudo nginx -t && sudo systemctl reload nginx

upstream admin_panel {
    server 127.0.0.1:8501;
}

server {
    listen 80;
    server_name admin.yourdomain.com;  # Замените на ваш домен
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.yourdomain.com;  # Замените на ваш домен
    
    # SSL certificates (используйте Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/admin.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yourdomain.com/privkey.pem;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Basic Authentication (дополнительная защита)
    auth_basic "Admin Panel - Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;
    
    # Allow specific IPs only (опционально, раскомментируйте если нужно)
    # allow 192.168.1.100;  # Ваш IP
    # allow 10.0.0.0/8;      # Внутренняя сеть
    # deny all;
    
    # Logging
    access_log /var/log/nginx/admin-panel-access.log;
    error_log /var/log/nginx/admin-panel-error.log;
    
    # Proxy settings
    location / {
        proxy_pass http://admin_panel;
        proxy_http_version 1.1;
        
        # WebSocket support (для Streamlit)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # Health check endpoint (без аутентификации для мониторинга)
    location /healthz {
        proxy_pass http://admin_panel/stream;
        access_log off;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
