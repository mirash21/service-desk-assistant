version: '3.8'

services:
  max-bot-webhook:
    build: .
    container_name: max-bot-webhook
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - YANDEX_API_KEY=${YANDEX_API_KEY}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - TTS_VOICE=${TTS_VOICE:-filipp}
      - TTS_LANGUAGE=${TTS_LANGUAGE:-ru-RU}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./temp:/app/temp
    networks:
      - npm_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s = socket.socket(); s.settimeout(2); s.connect(('localhost', 8081)); s.close()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  admin-panel:
    build:
      context: .
      dockerfile: admin_panel/Dockerfile
    container_name: admin-panel
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./data:/app/data
      - ./utils:/app/utils:ro
      - ./rag:/app/rag:ro
    depends_on:
      - max-bot-webhook
    networks:
      - npm_network

networks:
  npm_network:
    external: true
